version: '3.8'

services:
  python-app:
    build: .
    container_name: python-docker-app
    environment:
      # Set DISPLAY to connect to Windows X server from WSL Docker
      # Replace with your Windows host IP or use host.docker.internal
      - DISPLAY=host.docker.internal:0.0
    network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/app
    command: python youtube_automation.py
