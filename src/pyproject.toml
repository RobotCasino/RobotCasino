[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotcasino-robot"
version = "1.0.0"
requires-python = ">= 3.10.12"
readme = "README.md"
dependencies = [
    "pydoll-python>=2.15.1",
    "typer>=0.21.0",
    "rich>=10.11.0",
    "shellingham>=1.3.0",
    "Pygments<3.0.0,>=2.13.0",
    "markdown-it-py>=2.2.0",
    "aiohttp>=3.9.0"
]

[project.scripts]
robotcasino = "application.main:main"

[tool.setuptools.package-data]
application = ["core/**/*.json", "core/**/*.js", "data/**/*.js", "data/**/*.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["application*", "infrastructure*", "common*", "core*", "data*"]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]
